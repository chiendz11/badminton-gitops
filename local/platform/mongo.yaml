apiVersion: v1
kind: Service
metadata:
  name: mongo
  namespace: badminton
  labels:
    app: mongo
    badminton.io/part-of: badminton-local
spec:
  selector:
    app: mongo
  ports:
  - name: mongodb
    port: 27017
    targetPort: 27017
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mongo
  namespace: badminton
  labels:
    app: mongo
    badminton.io/part-of: badminton-local
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mongo
  template:
    metadata:
      labels:
        app: mongo
        badminton.io/part-of: badminton-local
    spec:
      automountServiceAccountToken: false
      containers:
      - name: mongo
        image: mongo:8
        imagePullPolicy: IfNotPresent
        ports:
        - name: mongodb
          containerPort: 27017
        readinessProbe:
          tcpSocket:
            port: 27017
          initialDelaySeconds: 5
          periodSeconds: 5
        livenessProbe:
          tcpSocket:
            port: 27017
          initialDelaySeconds: 10
          periodSeconds: 10
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            memory: 512Mi
        volumeMounts:
        - name: mongo-data
          mountPath: /data/db
      volumes:
      - name: mongo-data
        emptyDir: {}
