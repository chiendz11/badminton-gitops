apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: badminton
resources:
- postgres.yaml
- mongo.yaml
- redis.yaml
- rabbitmq.yaml
- cluster-secret-store.yaml
- ingress.yaml
- network-policies.yaml
configMapGenerator:
- name: postgres-init-script
  files:
  - init.sql=init-script.sql
