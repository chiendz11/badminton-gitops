apiVersion: apps/v1
kind: Deployment
metadata:
  name: mailpit
  namespace: badminton
  labels:
    app: mailpit
    badminton.io/part-of: badminton-local
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mailpit
  template:
    metadata:
      labels:
        app: mailpit
        badminton.io/part-of: badminton-local
    spec:
      automountServiceAccountToken: false
      containers:
      - name: mailpit
        image: axllent/mailpit:v1.24
        imagePullPolicy: IfNotPresent
        ports:
        - name: smtp
          containerPort: 1025
        - name: http
          containerPort: 8025
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            memory: 256Mi
        readinessProbe:
          tcpSocket:
            port: 8025
          initialDelaySeconds: 5
          periodSeconds: 5
        livenessProbe:
          tcpSocket:
            port: 8025
          initialDelaySeconds: 10
          periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: mailpit
  namespace: badminton
  labels:
    app: mailpit
    badminton.io/part-of: badminton-local
spec:
  ports:
  - name: smtp
    port: 1025
    targetPort: 1025
  - name: http
    port: 8025
    targetPort: 8025
  selector:
    app: mailpit
