apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-ingress-nginx
  namespace: badminton
spec:
  podSelector:
    matchExpressions:
    - key: app
      operator: In
      values: ["web", "admin", "api-gateway"]
  ingress:
  - {}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: database-policy
  namespace: badminton
spec:
  podSelector:
    matchExpressions:
    - key: app
      operator: In
      values: ["postgres", "mongo", "redis", "rabbitmq"]
  policyTypes:
  - Ingress
  ingress:
  - from:
    - podSelector:
        matchLabels:
          app: booking-core
    - podSelector:
        matchLabels:
          app: ai-service
    - podSelector:
        matchLabels:
          app: content-service
    - podSelector:
        matchLabels:
          app: identity-service
    - podSelector:
        matchLabels:
          app: commerce-service
    - podSelector:
        matchLabels:
          app: social-service
    - podSelector:
        matchLabels:
          app: notification-service
    - podSelector:
        matchLabels:
          app: storage-service
    - podSelector:
        matchLabels:
          app: api-gateway
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: mailpit-policy
  namespace: badminton
spec:
  podSelector:
    matchLabels:
      app: mailpit
  policyTypes:
  - Ingress
  ingress:
  - from:
    - podSelector:
        matchLabels:
          app: identity-service
    - podSelector:
        matchLabels:
          app: notification-service
    ports:
    - protocol: TCP
      port: 8025
    - protocol: TCP
      port: 1025
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: ingress-nginx
    ports:
    - protocol: TCP
      port: 8025
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: localstack-policy
  namespace: badminton
spec:
  podSelector:
    matchLabels:
      app: localstack
  policyTypes:
  - Ingress
  ingress:
  - from:
    - namespaceSelector: {}
    ports:
    - protocol: TCP
      port: 4566
