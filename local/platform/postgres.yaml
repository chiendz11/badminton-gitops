apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: badminton
  labels:
    app: postgres
    badminton.io/part-of: badminton-local
spec:
  type: NodePort
  selector:
    app: postgres
  ports:
  - name: tcp
    port: 5432
    targetPort: 5432
    nodePort: 30432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: badminton
  labels:
    app: postgres
    badminton.io/part-of: badminton-local
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
        badminton.io/part-of: badminton-local
    spec:
      automountServiceAccountToken: false
      containers:
      - name: postgres
        image: postgres:16-alpine
        envFrom:
        - secretRef:
            name: booking-database
        ports:
        - containerPort: 5432
        volumeMounts:
        - name: data
          mountPath: /var/lib/postgresql/data
        - name: init-script
          mountPath: /docker-entrypoint-initdb.d/init.sql
          subPath: init.sql
        readinessProbe:
          exec:
            command:
            - pg_isready
            - -U
            - booking
            - -d
            - booking
          periodSeconds: 3
          timeoutSeconds: 3
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            memory: 1Gi
      volumes:
      - name: init-script
        configMap:
          name: postgres-init-script
  volumeClaimTemplates:
  - metadata:
      name: data
    spec:
      accessModes:
      - ReadWriteOnce
      storageClassName: local-path
      resources:
        requests:
          storage: 2Gi

