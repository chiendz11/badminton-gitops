apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: badminton-ingress
  namespace: badminton
  annotations:
    cert-manager.io/cluster-issuer: badminton-local-ca
    nginx.ingress.kubernetes.io/ssl-redirect: 'true'
    nginx.ingress.kubernetes.io/proxy-buffer-size: 16k
spec:
  ingressClassName: nginx
  tls:
  - hosts:
    - web.badminton.local
    - badminton.local
    - admin.badminton.local
    - api.badminton.local
    - mailpit.badminton.local
    secretName: badminton-local-tls
  rules:
  - host: web.badminton.local
    http:
      paths:
      - path: /api
        pathType: Prefix
        backend:
          service:
            name: api-gateway
            port:
              number: 8081
      - path: /graphql
        pathType: Prefix
        backend:
          service:
            name: api-gateway
            port:
              number: 8081
      - path: /socket.io
        pathType: Prefix
        backend:
          service:
            name: api-gateway
            port:
              number: 8081
      - path: /
        pathType: Prefix
        backend:
          service:
            name: web
            port:
              number: 80
  - host: badminton.local
    http:
      paths:
      - path: /api
        pathType: Prefix
        backend:
          service:
            name: api-gateway
            port:
              number: 8081
      - path: /graphql
        pathType: Prefix
        backend:
          service:
            name: api-gateway
            port:
              number: 8081
      - path: /socket.io
        pathType: Prefix
        backend:
          service:
            name: api-gateway
            port:
              number: 8081
      - path: /
        pathType: Prefix
        backend:
          service:
            name: web
            port:
              number: 80
  - host: admin.badminton.local
    http:
      paths:
      - path: /api
        pathType: Prefix
        backend:
          service:
            name: api-gateway
            port:
              number: 8081
      - path: /graphql
        pathType: Prefix
        backend:
          service:
            name: api-gateway
            port:
              number: 8081
      - path: /socket.io
        pathType: Prefix
        backend:
          service:
            name: api-gateway
            port:
              number: 8081
      - path: /
        pathType: Prefix
        backend:
          service:
            name: admin
            port:
              number: 80
  - host: api.badminton.local
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: api-gateway
            port:
              number: 8081
  - host: mailpit.badminton.local
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: mailpit
            port:
              number: 8025
