apiVersion: batch/v1
kind: Job
metadata:
  name: ai-service-migrate
  namespace: badminton
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/sync-wave: '-10'
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
  labels:
    app: ai-service
    badminton.io/part-of: badminton-local
spec:
  backoffLimit: 2
  activeDeadlineSeconds: 300
  template:
    metadata:
      labels:
        app: ai-service
        badminton.io/part-of: badminton-local
    spec:
      restartPolicy: Never
      serviceAccountName: ai-service
      automountServiceAccountToken: false
      containers:
      - name: migrate
        image: registry.invalid/badminton-local/ai-service-migrations:NOT_BUILT
        imagePullPolicy: IfNotPresent
        command:
        - sh
        - -c
        - alembic upgrade head && python -m app.migrate
        envFrom:
        - configMapRef:
            name: ai-service-config
        - secretRef:
            name: ai-service-secrets
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            memory: 256Mi
