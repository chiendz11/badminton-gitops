apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: badminton
resources:
- deployment.yaml
- service.yaml
configMapGenerator:
- name: ai-service-config
  literals:
  - APP_ENV=development
  - BOOKING_CORE_URL=http://booking-core:3000
  - JWT_ISSUER=badminton-identity
  - JWT_AUDIENCE=badminton-system
  - AI_PROVIDER=fake
  - AI_OFFLINE=true
  - PROPOSAL_TTL_SECONDS=300
generatorOptions:
  disableNameSuffixHash: true
