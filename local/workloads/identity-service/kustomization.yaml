apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: badminton
resources:
- deployment.yaml
- service.yaml
- external-secret.yaml
- hpa.yaml
- pdb.yaml
configMapGenerator:
- name: identity-service-config
  literals:
  - PORT=8084
  - NODE_ENV=development
  - JWT_ISSUER=badminton-identity
  - JWT_AUDIENCE=badminton-system
generatorOptions:
  disableNameSuffixHash: true
