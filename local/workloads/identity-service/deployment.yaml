apiVersion: apps/v1
kind: Deployment
metadata:
  name: identity-service
  namespace: badminton
  labels:
    app: identity-service
    badminton.io/part-of: badminton-local
spec:
  replicas: 1
  selector:
    matchLabels:
      app: identity-service
  template:
    metadata:
      labels:
        app: identity-service
        badminton.io/part-of: badminton-local
    spec:
      automountServiceAccountToken: false
      containers:
      - name: identity-service
        image: registry.invalid/badminton-local/identity-service:latest
        imagePullPolicy: IfNotPresent
        ports:
        - name: http
          containerPort: 8084
        envFrom:
        - configMapRef:
            name: identity-service-config
        startupProbe:
          httpGet:
            path: /health/ready
            port: http
          periodSeconds: 5
          timeoutSeconds: 2
          failureThreshold: 30
        readinessProbe:
          httpGet:
            path: /health/ready
            port: http
          periodSeconds: 5
          timeoutSeconds: 2
        livenessProbe:
          httpGet:
            path: /health
            port: http
          periodSeconds: 10
          timeoutSeconds: 2
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            memory: 512Mi
