apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: badminton
resources:
- deployment.yaml
- service.yaml
- hpa.yaml
- pdb.yaml
configMapGenerator:
- name: content-service-config
  literals:
  - CONTENT_PORT=3001
  - NODE_ENV=development
  - MONGODB_URI=mongodb://mongo:27017/badminton_content
  - JWT_ISSUER=badminton-identity
  - JWT_AUDIENCE=badminton-system
generatorOptions:
  disableNameSuffixHash: true
