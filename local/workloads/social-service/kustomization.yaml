apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: badminton
resources:
- service-account.yaml
- deployment.yaml
- service.yaml
- hpa.yaml
- pdb.yaml
- external-secret.yaml
- network-policy.yaml
configMapGenerator:
- name: social-service-config
  literals:
  - PORT=3000
  - NODE_ENV=development
  - LOG_LEVEL=info
  - JWT_ISSUER=badminton-identity
  - JWT_AUDIENCE=badminton-system
  - CORS_ORIGINS=https://web.badminton.local,https://admin.badminton.local,http://localhost:5173,http://localhost:5174
  - REDIS_HOST=redis
  - REDIS_PORT=6379
  - BOOKING_CORE_URL=http://booking-core:3000
  - SOCKET_IO_REDIS_ADAPTER_ENABLED=true
generatorOptions:
  disableNameSuffixHash: false
