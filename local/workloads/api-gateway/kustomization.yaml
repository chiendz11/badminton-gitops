apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: badminton
resources:
- deployment.yaml
- service.yaml
configMapGenerator:
- name: api-gateway-config
  literals:
  - PORT=8081
  - NODE_ENV=development
  - BOOKING_CORE_URL=http://booking-core:3000
  - CONTENT_SERVICE_URL=http://content-service:3001
  - CONTENT_UPSTREAM_TIMEOUT_MS=5000
  - AI_SERVICE_URL=http://ai-service:8000
  - AI_UPSTREAM_TIMEOUT_MS=45000
  - JWT_ISSUER=badminton-identity
  - JWT_AUDIENCE=badminton-system
  - CORS_ORIGINS=http://localhost:5173,http://localhost:5174,http://localhost:8082,http://localhost:8083,http://127.0.0.1:5173,http://127.0.0.1:5174,http://127.0.0.1:8082,http://127.0.0.1:8083,http://127.0.0.1:18082,http://127.0.0.1:18083
generatorOptions:
  disableNameSuffixHash: true
