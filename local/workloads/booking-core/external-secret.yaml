apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: booking-core
  namespace: badminton
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/sync-wave: '-20'
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: aws-secrets-manager
  target:
    name: booking-core-secrets
    creationPolicy: Orphan
  data:
  - secretKey: JWT_SECRET
    remoteRef:
      key: badminton/prod/booking-core-runtime
      property: jwt_secret
  - secretKey: METRICS_TOKEN
    remoteRef:
      key: badminton/prod/booking-core-runtime
      property: metrics_token
  - secretKey: INTERNAL_SERVICE_TOKEN
    remoteRef:
      key: badminton/prod/booking-core-runtime
      property: internal_service_token
  - secretKey: DATABASE_URL
    remoteRef:
      key: badminton/prod/booking-core-runtime
      property: database_url
  - secretKey: REDIS_URL
    remoteRef:
      key: badminton/prod/booking-core-runtime
      property: redis_url
  - secretKey: RABBITMQ_URL
    remoteRef:
      key: badminton/prod/booking-core-runtime
      property: rabbitmq_url
  - secretKey: PAYOS_CLIENT_ID
    remoteRef:
      key: badminton/prod/payos
      property: client_id
  - secretKey: PAYOS_API_KEY
    remoteRef:
      key: badminton/prod/payos
      property: api_key
  - secretKey: PAYOS_CHECKSUM_KEY
    remoteRef:
      key: badminton/prod/payos
      property: checksum_key
