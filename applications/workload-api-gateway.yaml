apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: workload-api-gateway
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: '20'
spec:
  project: badminton-production
  source:
    repoURL: https://github.com/chiendz11/badminton-gitops.git
    targetRevision: main
    path: environments/production/api-gateway
  destination:
    server: https://kubernetes.default.svc
    namespace: badminton
  syncPolicy:
    syncOptions:
    - ServerSideApply=true
    - RespectIgnoreDifferences=true
    retry:
      limit: 10
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
  ignoreDifferences:
  - group: apps
    kind: Deployment
    jsonPointers:
    - /spec/replicas
