apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: badminton-local-apps
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: '0'
spec:
  project: badminton-local
  source:
    repoURL: https://github.com/chiendz11/badminton-gitops.git
    targetRevision: main
    path: environments/local/apps
  destination:
    server: https://kubernetes.default.svc
    namespace: badminton
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=true
    - ServerSideApply=true
    - RespectIgnoreDifferences=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
  ignoreDifferences:
  - group: apps
    kind: Deployment
    jsonPointers:
    - /spec/replicas
