apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: platform-cert-manager
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: '-36'
spec:
  project: badminton-production
  source:
    repoURL: https://charts.jetstack.io
    targetRevision: v1.21.2
    chart: cert-manager
    helm:
      releaseName: cert-manager
      valuesObject:
        crds:
          enabled: true
          keep: true
        prometheus:
          enabled: true
          servicemonitor:
            enabled: true
            labels:
              release: monitoring
  destination:
    server: https://kubernetes.default.svc
    namespace: cert-manager
  syncPolicy:
    syncOptions:
    - ServerSideApply=true
    retry:
      limit: 10
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
