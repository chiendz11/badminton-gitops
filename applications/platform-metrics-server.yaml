apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: platform-metrics-server
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: '-45'
spec:
  project: badminton-production
  source:
    repoURL: https://kubernetes-sigs.github.io/metrics-server/
    targetRevision: 3.13.1
    chart: metrics-server
    helm:
      releaseName: metrics-server
      valuesObject:
        replicas: 2
        podDisruptionBudget:
          enabled: true
          maxUnavailable: 1
  destination:
    server: https://kubernetes.default.svc
    namespace: kube-system
  syncPolicy:
    syncOptions:
    - ServerSideApply=true
    retry:
      limit: 10
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
