apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: commerce-service
  namespace: badminton
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/sync-wave: '-20'
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: aws-secrets-manager
  target:
    name: commerce-service-secrets
    creationPolicy: Orphan
  data:
  - secretKey: JWT_SECRET
    remoteRef:
      key: badminton/prod/commerce-service-runtime
      property: jwt_secret
  - secretKey: METRICS_TOKEN
    remoteRef:
      key: badminton/prod/commerce-service-runtime
      property: metrics_token
  - secretKey: INTERNAL_SERVICE_TOKEN
    remoteRef:
      key: badminton/prod/commerce-service-runtime
      property: internal_service_token
  - secretKey: DATABASE_URL
    remoteRef:
      key: badminton/prod/commerce-service-runtime
      property: database_url
  - secretKey: RABBITMQ_URL
    remoteRef:
      key: badminton/prod/commerce-service-runtime
      property: rabbitmq_url
