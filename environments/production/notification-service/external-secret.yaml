apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: notification-service
  namespace: badminton
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: aws-secrets-manager
  target:
    name: notification-service-secrets
    creationPolicy: Orphan
  data:
  - secretKey: JWT_SECRET
    remoteRef:
      key: badminton/prod/notification-service-runtime
      property: jwt_secret
  - secretKey: METRICS_TOKEN
    remoteRef:
      key: badminton/prod/notification-service-runtime
      property: metrics_token
  - secretKey: INTERNAL_SERVICE_TOKEN
    remoteRef:
      key: badminton/prod/notification-service-runtime
      property: internal_service_token
  - secretKey: MONGODB_URI
    remoteRef:
      key: badminton/prod/notification-service-runtime
      property: mongodb_uri
  - secretKey: RABBITMQ_URL
    remoteRef:
      key: badminton/prod/notification-service-runtime
      property: rabbitmq_url
