apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: notification-service
  namespace: badminton
  labels:
    release: monitoring
spec:
  selector:
    matchLabels:
      app: notification-service
  endpoints:
  - port: http
    path: /metrics
    interval: 15s
    authorization:
      type: Bearer
      credentials:
        name: notification-service-secrets
        key: METRICS_TOKEN
