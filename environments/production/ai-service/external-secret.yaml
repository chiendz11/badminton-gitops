apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ai-service
  namespace: badminton
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/sync-wave: '-20'
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: aws-secrets-manager
  target:
    name: ai-service-secrets
    creationPolicy: Orphan
  data:
  - secretKey: JWT_SECRET
    remoteRef:
      key: badminton/prod/ai-service-runtime
      property: jwt_secret
  - secretKey: METRICS_TOKEN
    remoteRef:
      key: badminton/prod/ai-service-runtime
      property: metrics_token
  - secretKey: INTERNAL_SERVICE_TOKEN
    remoteRef:
      key: badminton/prod/ai-service-runtime
      property: internal_service_token
  - secretKey: AI_DATABASE_URL
    remoteRef:
      key: badminton/prod/ai-service-runtime
      property: database_url
  - secretKey: REDIS_URL
    remoteRef:
      key: badminton/prod/ai-service-runtime
      property: redis_url
  - secretKey: LLM_API_KEY
    remoteRef:
      key: badminton/prod/llm
      property: api_key
