apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
- service-account.yaml
- external-secret.yaml
- deployment.yaml
- service.yaml
- hpa.yaml
- pdb.yaml
- network-policy.yaml
- migration-job.yaml
- servicemonitor.yaml
- prometheusrule.yaml
configMapGenerator:
- name: ai-service-config
  namespace: badminton
  literals:
  - PORT=8000
  - NODE_ENV=production
  - LOG_LEVEL=info
  - JWT_ISSUER=badminton-identity
  - JWT_AUDIENCE=badminton-system
  - CORS_ORIGINS=https://badminton.example.com,https://admin.badminton.example.com
  - REDIS_HOST=UNCONFIGURED_REDIS_HOST
  - REDIS_PORT=6379
  - REDIS_TLS=true
  - BOOKING_CORE_URL=http://booking-core:3000
  - APP_ENV=production
  - AI_PROVIDER=openai-compatible
  - AI_OFFLINE=false
  - LLM_BASE_URL=https://api.groq.com/openai/v1
  - LLM_MODEL=openai/gpt-oss-120b
  - LLM_TIMEOUT_SECONDS=25
  - CORE_TIMEOUT_SECONDS=5
generatorOptions:
  disableNameSuffixHash: false
images:
- name: badminton-ai-service
  newName: UNCONFIGURED_IMAGE_REPOSITORY
  newTag: unreleased
