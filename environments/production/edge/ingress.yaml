apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: badminton-public
  namespace: badminton
  annotations:
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP":80},{"HTTPS":443}]'
    alb.ingress.kubernetes.io/ssl-redirect: '443'
    alb.ingress.kubernetes.io/certificate-arn: UNCONFIGURED_CERTIFICATE_ARN
    alb.ingress.kubernetes.io/healthcheck-path: /health/ready
    alb.ingress.kubernetes.io/load-balancer-attributes: idle_timeout.timeout_seconds=120
    external-dns.alpha.kubernetes.io/hostname: badminton.example.com,admin.badminton.example.com
    alb.ingress.kubernetes.io/actions.admin-redirect: '{"Type": "redirect", "RedirectConfig": {"Protocol": "HTTPS",
      "Host": "admin.badminton.example.com", "Port": "443", "Path": "/", "Query": "#{query}", "StatusCode": "HTTP_302"}}'
spec:
  ingressClassName: alb
  rules:
  - host: badminton.example.com
    http:
      paths:
      - path: /admin
        pathType: Prefix
        backend:
          service:
            name: admin-redirect
            port:
              name: use-annotation
      - path: /api
        pathType: Prefix
        backend:
          service:
            name: api-gateway
            port:
              name: http
      - path: /graphql
        pathType: Prefix
        backend:
          service:
            name: api-gateway
            port:
              name: http
      - path: /socket.io
        pathType: Prefix
        backend:
          service:
            name: social-service
            port:
              name: http
      - path: /
        pathType: Prefix
        backend:
          service:
            name: web
            port:
              name: http
  - host: admin.badminton.example.com
    http:
      paths:
      - path: /api
        pathType: Prefix
        backend:
          service:
            name: api-gateway
            port:
              name: http
      - path: /graphql
        pathType: Prefix
        backend:
          service:
            name: api-gateway
            port:
              name: http
      - path: /socket.io
        pathType: Prefix
        backend:
          service:
            name: social-service
            port:
              name: http
      - path: /
        pathType: Prefix
        backend:
          service:
            name: admin
            port:
              name: http
