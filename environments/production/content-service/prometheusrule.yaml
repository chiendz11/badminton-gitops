apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: content-service
  namespace: badminton
  labels:
    release: monitoring
spec:
  groups:
  - name: content-service
    rules:
    - alert: ContentServiceUnavailable
      expr: up{namespace="badminton",service="content-service"} == 0
      for: 2m
      labels:
        severity: critical
      annotations:
        summary: content-service scrape target unavailable
    - alert: ContentServiceHighErrorRate
      expr: sum(rate(content_service_http_requests_total{status=~"5.."}[5m])) / clamp_min(sum(rate(content_service_http_requests_total[5m])),
        0.001) > 0.05
      for: 5m
      labels:
        severity: warning
    - alert: ContentServiceHighLatency
      expr: histogram_quantile(0.95, sum by (le) (rate(content_service_http_duration_seconds_bucket[5m]))) > 2
      for: 5m
      labels:
        severity: warning
