apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: content-service
  namespace: badminton
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: aws-secrets-manager
  target:
    name: content-service-secrets
    creationPolicy: Orphan
  data:
  - secretKey: JWT_SECRET
    remoteRef:
      key: badminton/prod/content-service-runtime
      property: jwt_secret
  - secretKey: METRICS_TOKEN
    remoteRef:
      key: badminton/prod/content-service-runtime
      property: metrics_token
  - secretKey: INTERNAL_SERVICE_TOKEN
    remoteRef:
      key: badminton/prod/content-service-runtime
      property: internal_service_token
  - secretKey: MONGODB_URI
    remoteRef:
      key: badminton/prod/content-service-runtime
      property: mongodb_uri
