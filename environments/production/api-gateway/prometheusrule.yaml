apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: api-gateway
  namespace: badminton
  labels:
    release: monitoring
spec:
  groups:
  - name: api-gateway
    rules:
    - alert: ApiGatewayUnavailable
      expr: up{namespace="badminton",service="api-gateway"} == 0
      for: 2m
      labels:
        severity: critical
      annotations:
        summary: api-gateway scrape target unavailable
    - alert: ApiGatewayHighErrorRate
      expr: sum(rate(api_gateway_http_requests_total{status=~"5.."}[5m])) / clamp_min(sum(rate(api_gateway_http_requests_total[5m])),
        0.001) > 0.05
      for: 5m
      labels:
        severity: warning
    - alert: ApiGatewayHighLatency
      expr: histogram_quantile(0.95, sum by (le) (rate(api_gateway_http_duration_seconds_bucket[5m]))) > 2
      for: 5m
      labels:
        severity: warning
