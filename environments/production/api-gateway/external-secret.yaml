apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: api-gateway
  namespace: badminton
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: aws-secrets-manager
  target:
    name: api-gateway-secrets
    creationPolicy: Orphan
  data:
  - secretKey: JWT_SECRET
    remoteRef:
      key: badminton/prod/api-gateway-runtime
      property: jwt_secret
  - secretKey: METRICS_TOKEN
    remoteRef:
      key: badminton/prod/api-gateway-runtime
      property: metrics_token
  - secretKey: INTERNAL_SERVICE_TOKEN
    remoteRef:
      key: badminton/prod/api-gateway-runtime
      property: internal_service_token
