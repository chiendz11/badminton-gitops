apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
- service-account.yaml
- external-secret.yaml
- deployment.yaml
- service.yaml
- hpa.yaml
- pdb.yaml
- network-policy.yaml
- servicemonitor.yaml
- prometheusrule.yaml
configMapGenerator:
- name: api-gateway-config
  namespace: badminton
  literals:
  - PORT=8081
  - NODE_ENV=production
  - LOG_LEVEL=info
  - JWT_ISSUER=badminton-identity
  - JWT_AUDIENCE=badminton-system
  - CORS_ORIGINS=https://badminton.example.com,https://admin.badminton.example.com
  - IDENTITY_SERVICE_URL=http://identity-service:3000
  - BOOKING_CORE_URL=http://booking-core:3000
  - COMMERCE_SERVICE_URL=http://commerce-service:3000
  - SOCIAL_SERVICE_URL=http://social-service:3000
  - CONTENT_SERVICE_URL=http://content-service:3000
  - NOTIFICATION_SERVICE_URL=http://notification-service:3000
  - STORAGE_SERVICE_URL=http://storage-service:3000
  - AI_SERVICE_URL=http://ai-service:8000
  - UPSTREAM_TIMEOUT_MS=5000
  - AI_UPSTREAM_TIMEOUT_MS=45000
generatorOptions:
  disableNameSuffixHash: false
images:
- name: badminton-api-gateway
  newName: UNCONFIGURED_IMAGE_REPOSITORY
  newTag: unreleased
