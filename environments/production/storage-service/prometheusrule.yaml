apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: storage-service
  namespace: badminton
  labels:
    release: monitoring
spec:
  groups:
  - name: storage-service
    rules:
    - alert: StorageServiceUnavailable
      expr: up{namespace="badminton",service="storage-service"} == 0
      for: 2m
      labels:
        severity: critical
      annotations:
        summary: storage-service scrape target unavailable
    - alert: StorageServiceHighErrorRate
      expr: sum(rate(storage_service_http_requests_total{status=~"5.."}[5m])) / clamp_min(sum(rate(storage_service_http_requests_total[5m])),
        0.001) > 0.05
      for: 5m
      labels:
        severity: warning
    - alert: StorageServiceHighLatency
      expr: histogram_quantile(0.95, sum by (le) (rate(storage_service_http_duration_seconds_bucket[5m]))) > 2
      for: 5m
      labels:
        severity: warning
