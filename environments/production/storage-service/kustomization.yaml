apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
- service-account.yaml
- external-secret.yaml
- deployment.yaml
- service.yaml
- hpa.yaml
- pdb.yaml
- network-policy.yaml
- servicemonitor.yaml
- prometheusrule.yaml
configMapGenerator:
- name: storage-service-config
  namespace: badminton
  literals:
  - PORT=3000
  - NODE_ENV=production
  - LOG_LEVEL=info
  - JWT_ISSUER=badminton-identity
  - JWT_AUDIENCE=badminton-system
  - CORS_ORIGINS=https://badminton.example.com,https://admin.badminton.example.com
generatorOptions:
  disableNameSuffixHash: false
images:
- name: badminton-storage-service
  newName: UNCONFIGURED_IMAGE_REPOSITORY
  newTag: unreleased
