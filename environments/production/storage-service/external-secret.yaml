apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: storage-service
  namespace: badminton
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: aws-secrets-manager
  target:
    name: storage-service-secrets
    creationPolicy: Orphan
  data:
  - secretKey: JWT_SECRET
    remoteRef:
      key: badminton/prod/storage-service-runtime
      property: jwt_secret
  - secretKey: METRICS_TOKEN
    remoteRef:
      key: badminton/prod/storage-service-runtime
      property: metrics_token
  - secretKey: INTERNAL_SERVICE_TOKEN
    remoteRef:
      key: badminton/prod/storage-service-runtime
      property: internal_service_token
  - secretKey: MONGODB_URI
    remoteRef:
      key: badminton/prod/storage-service-runtime
      property: mongodb_uri
  - secretKey: CLOUDINARY_CLOUD_NAME
    remoteRef:
      key: badminton/prod/cloudinary
      property: cloud_name
  - secretKey: CLOUDINARY_API_KEY
    remoteRef:
      key: badminton/prod/cloudinary
      property: api_key
  - secretKey: CLOUDINARY_API_SECRET
    remoteRef:
      key: badminton/prod/cloudinary
      property: api_secret
