apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: identity-service
  namespace: badminton
  labels:
    release: monitoring
spec:
  groups:
  - name: identity-service
    rules:
    - alert: IdentityServiceUnavailable
      expr: up{namespace="badminton",service="identity-service"} == 0
      for: 2m
      labels:
        severity: critical
      annotations:
        summary: identity-service scrape target unavailable
    - alert: IdentityServiceHighErrorRate
      expr: sum(rate(identity_service_http_requests_total{status=~"5.."}[5m])) / clamp_min(sum(rate(identity_service_http_requests_total[5m])),
        0.001) > 0.05
      for: 5m
      labels:
        severity: warning
    - alert: IdentityServiceHighLatency
      expr: histogram_quantile(0.95, sum by (le) (rate(identity_service_http_duration_seconds_bucket[5m]))) > 2
      for: 5m
      labels:
        severity: warning
