apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: badminton-root
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/chiendz11/badminton-gitops.git
    targetRevision: main
    path: applications
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - ServerSideApply=true
    retry:
      limit: 5
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
