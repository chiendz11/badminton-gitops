name: CI
'on':
  pull_request: {}
  push:
    branches:
    - main
permissions:
  contents: read
jobs:
  required:
    name: CI / required
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      with:
        persist-credentials: false
    - name: Install checksum-pinned kubectl and kubeconform
      run: |
        set -euo pipefail
        mkdir -p "${RUNNER_TEMP}/bin"
        curl -fsSL "https://dl.k8s.io/release/v1.35.5/bin/linux/amd64/kubectl" -o "${RUNNER_TEMP}/bin/kubectl"
        echo "90f75ea6ecc9ea5633262e1c0b83a40560003b30fc94a04cb099404fcef0c224  ${RUNNER_TEMP}/bin/kubectl" | sha256sum -c -
        chmod +x "${RUNNER_TEMP}/bin/kubectl"

        curl -fsSL "https://github.com/yannh/kubeconform/releases/download/v0.8.0/kubeconform-linux-amd64.tar.gz" -o "${RUNNER_TEMP}/kubeconform.tar.gz"
        echo "9bc2bffbf71f261128533edaf912153948b7ff238f9a531ae6d34466ec287883  ${RUNNER_TEMP}/kubeconform.tar.gz" | sha256sum -c -
        tar -xzf "${RUNNER_TEMP}/kubeconform.tar.gz" -C "${RUNNER_TEMP}/bin" kubeconform
        chmod +x "${RUNNER_TEMP}/bin/kubeconform"
        echo "${RUNNER_TEMP}/bin" >> "${GITHUB_PATH}"
    - name: Render and validate all Kustomize roots
      run: |
        set -euo pipefail
        ROOTS=(
          bootstrap/local
          bootstrap/production
          applications/local
          applications
          environments/local/platform
          environments/local/observability
          environments/local/applications
          environments/local/apps
          environments/production/workloads
          environments/production/edge
          platform/namespaces
          platform/storage
          platform/policies
          platform/external-secrets-config
          platform/secrets
          platform/argocd-monitoring
        )
        mkdir -p "${RUNNER_TEMP}/rendered"
        for root in "${ROOTS[@]}"; do
          out="${RUNNER_TEMP}/rendered/${root//\//_}.yaml"
          echo "=== Rendering ${root} ==="
          kubectl kustomize "${root}" > "${out}"
          kubeconform -strict -ignore-missing-schemas -kubernetes-version 1.35.0 -summary "${out}"
        done
        for standalone in applications/addons/*.yaml; do
          echo "=== Validating ${standalone} ==="
          kubeconform -strict -ignore-missing-schemas -kubernetes-version 1.35.0 -summary "${standalone}"
        done
    - name: Guard against committed Secret values, mutable local images, and broken links
      run: |
        python3 - <<'PYTHON'
        import re
        from pathlib import Path
        from urllib.parse import unquote, urlsplit

        root = Path(".").resolve()
        for path in sorted(root.rglob("*.yaml")):
            text = path.read_text(encoding="utf-8")
            if re.search(r"(?m)^kind:\s*Secret\b", text):
                raise ValueError(f"Committed Kubernetes Secret manifest is forbidden: {path.relative_to(root)}")
            if re.search(r"(?m)^kind:\s*Namespace\b", text) and "platform/namespaces" not in path.as_posix():
                raise ValueError(f"Duplicate Namespace owner outside platform/namespaces: {path.relative_to(root)}")
        for pattern in ("local/**/*.yaml", "environments/local/**/*.yaml"):
            for path in sorted(root.glob(pattern)):
                text = path.read_text(encoding="utf-8")
                if re.search(r"(?:image|newTag):\s*[^\n]*\blatest\b", text):
                    raise ValueError(f"Mutable :latest image is forbidden in local manifests: {path.relative_to(root)}")
        for md in [root / "README.md", root / "AGENTS.md", *sorted((root / "docs").rglob("*.md"))]:
            clean = re.sub(r"^```[^\n]*\n.*?^```\s*$", "", md.read_text(encoding="utf-8"), flags=re.M | re.S)
            for target in re.findall(r"\]\((<[^>]+>|[^\s)]+)(?:\s+\"[^\"]*\")?\)", clean):
                target = target.strip("<>")
                if urlsplit(target).scheme:
                    continue
                name, _, _ = target.partition("#")
                if not name:
                    continue
                candidate = (md.parent / unquote(name)).resolve()
                if not candidate.is_relative_to(root) and (
                    candidate.is_relative_to(root.parent / "badminton-system")
                    or candidate.is_relative_to(root.parent / "badminton-infras")
                ):
                    continue
                if not candidate.is_relative_to(root) or not candidate.exists():
                    raise ValueError(f"Broken markdown link in {md.relative_to(root)}: {target}")
        print("Pure GitOps manifest and link policy checks passed.")
        PYTHON
