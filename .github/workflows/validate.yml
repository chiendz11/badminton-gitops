name: GitOps validation
'on':
  pull_request: {}
  push:
    branches:
    - main
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  validate:
    name: validate
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Install contract dependencies
      run: python -m pip install -r requirements.txt
    - uses: azure/setup-kubectl@v4
      with:
        version: v1.35.0
    - uses: imranismail/setup-kustomize@v2
      with:
        kustomize-version: 5.7.1
    - name: Install validation tools
      run: |-
        python -m pip install yamllint==1.35.1
        curl -fsSL https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz | tar xz kubeconform
        sudo install kubeconform /usr/local/bin/kubeconform
    - name: Lint authored YAML
      run: yamllint applications platform environments .github
    - name: Build every Kustomize root and check standard resources and policies
      shell: bash
      run: |
        set -euo pipefail
        mkdir -p /tmp/badminton-rendered
        while IFS= read -r root; do
          target="/tmp/badminton-rendered/$(printf '%s' "$root" | tr '/' '_').yaml"
          kustomize build "$root" > "$target"
          kubeconform -strict -summary -ignore-missing-schemas "$target"
          python -m automation.policy_check "$target"
        done < <(rg --files applications platform environments -g kustomization.yaml | sed 's@/kustomization.yaml$@@' | sort)
