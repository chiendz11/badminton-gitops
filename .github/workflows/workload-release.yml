name: Workload release PR
'on':
  repository_dispatch:
    types:
    - workload-release-v1
  workflow_dispatch:
    inputs:
      contract:
        description: Workload release v1 JSON
        required: true
        type: string
concurrency:
  group: production-gitops-writer
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    environment: production-automation
    permissions:
      contents: read
      id-token: write
    if: github.ref == 'refs/heads/main'
    steps:
    - uses: actions/checkout@v4
      with:
        ref: main
        fetch-depth: 0
    - name: Check dispatch sender
      if: github.event_name == 'repository_dispatch'
      env:
        EXPECTED_SENDER: ${{ vars.DISPATCH_SENDER }}
        ACTUAL_SENDER: ${{ github.event.sender.login }}
      run: test -n "$EXPECTED_SENDER" && test "$ACTUAL_SENDER" = "$EXPECTED_SENDER"
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Install contract dependencies
      run: python -m pip install -r requirements.txt
    - name: Create automation GitHub App token
      id: app
      uses: actions/create-github-app-token@v2
      with:
        app-id: ${{ vars.AUTOMATION_APP_ID }}
        private-key: ${{ secrets.AUTOMATION_APP_PRIVATE_KEY }}
        owner: chiendz11
        repositories: badminton-gitops
        permission-contents: write
        permission-pull-requests: write
    - name: Create read-only app provenance token
      id: source
      uses: actions/create-github-app-token@v2
      with:
        app-id: ${{ vars.AUTOMATION_APP_ID }}
        private-key: ${{ secrets.AUTOMATION_APP_PRIVATE_KEY }}
        owner: chiendz11
        repositories: badminton_system
        permission-contents: read
        permission-actions: read
    - uses: aws-actions/configure-aws-credentials@v4
      with:
        role-to-assume: ${{ vars.RELEASE_VERIFIER_ROLE_ARN }}
        aws-region: ${{ vars.AWS_REGION }}
    - uses: sigstore/cosign-installer@v3
      with:
        cosign-release: v2.5.3
    - name: Authenticate read-only ECR access
      uses: aws-actions/amazon-ecr-login@v2
    - name: Read release intent
      run: python -m automation.event_payload
    - name: Verify CI, signed digest and commit binding
      env:
        APP_CI_WORKFLOW: ${{ vars.APP_CI_WORKFLOW || 'ci.yml' }}
        IMAGE_SIGNER_IDENTITY: ${{ vars.IMAGE_SIGNER_IDENTITY }}
        GH_TOKEN: ${{ steps.source.outputs.token }}
      run: python -m automation.verify_release payload.json
    - name: Render approved component
      run: |-
        python -m automation.workload_release.renderer payload.json
        python -m automation.policy_check
    - name: Set PR metadata
      run: |
        python - <<'PY'
        import json, os
        p = json.load(open('payload.json'))
        with open(os.environ['GITHUB_ENV'], 'a') as output:
            output.write(f"PR_BRANCH=release/{p['component']}\n")
            output.write(f"PR_TITLE=Release {p['component']} at {p['image']['digest']}\n")
        PY
    - name: Open review PR
      uses: peter-evans/create-pull-request@v7
      with:
        token: ${{ steps.app.outputs.token }}
        branch: ${{ env.PR_BRANCH }}
        base: main
        commit-message: ${{ env.PR_TITLE }}
        title: ${{ env.PR_TITLE }}
        body: Automated change to production desired state. Review the contract, rendered manifests and image provenance before
          merging. Argo CD reconciles after merge.
        delete-branch: true
